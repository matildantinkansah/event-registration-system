AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Event Registration & Ticketing System - Serverless REST API.
  Capstone Project - AWS Cloud Computing & AI Programme.

# ----------------------------------------------------------------------------
# PARAMETERS
# These are values you supply when deploying. They keep secrets/emails out
# of the code itself.
# ----------------------------------------------------------------------------
Parameters:
  BudgetNotificationEmail:
    Type: String
    Description: Email address that receives AWS cost alerts (AWS Budgets).

  OrganizerNotificationEmail:
    Type: String
    Description: Email address that receives a notification (via SNS) every time someone registers, and CloudWatch alarm alerts.

# ----------------------------------------------------------------------------
# GLOBALS
# Settings shared by every Lambda function below, so we don't repeat them.
# ----------------------------------------------------------------------------
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        REGISTRATIONS_TABLE: !Ref RegistrationsTable
        SNS_TOPIC_ARN: !Ref RegistrationTopic

Resources:

  # --------------------------------------------------------------------------
  # DYNAMODB TABLES (our "database" - replaces the Excel spreadsheet)
  # --------------------------------------------------------------------------

  # Stores each event (name, date, capacity, how many have registered)
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventsTable
      BillingMode: PAY_PER_REQUEST   # You only pay for what you use - stays in Free Tier for a student project
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  # Stores each individual registration (who registered for which event)
  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RegistrationsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S
      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH

  # --------------------------------------------------------------------------
  # SNS TOPIC (sends the organizer an email whenever someone registers)
  # --------------------------------------------------------------------------
  RegistrationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: EventRegistrationNotifications

  RegistrationTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RegistrationTopic
      Protocol: email
      Endpoint: !Ref OrganizerNotificationEmail

  # --------------------------------------------------------------------------
  # LAMBDA FUNCTIONS (the "business logic" - the code that actually runs)
  # --------------------------------------------------------------------------

  # GET /events -> returns the list of events and their availability
  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetEventsFunction
      CodeUri: src/
      Handler: get_events_handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        GetEvents:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /events
            Method: GET

  # POST /register -> registers someone for an event
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RegisterFunction
      CodeUri: src/
      Handler: register_handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt RegistrationTopic.TopicName
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref EventApi
            Path: /register
            Method: POST

  # --------------------------------------------------------------------------
  # API GATEWAY (the "front door" - turns HTTP requests into Lambda calls)
  # --------------------------------------------------------------------------
  EventApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # --------------------------------------------------------------------------
  # CLOUDWATCH ALARM (watches for errors and alerts you)
  # --------------------------------------------------------------------------
  RegisterFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: RegisterFunction-Errors
      AlarmDescription: Fires if the RegisterFunction throws an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RegisterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref RegistrationTopic
      TreatMissingData: notBreaching

  # --------------------------------------------------------------------------
  # AWS BUDGET (keeps you inside the Free Tier / alerts you before you get charged)
  # --------------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: EventRegistrationSystem-MonthlyBudget
        BudgetLimit:
          Amount: 5
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail

# ----------------------------------------------------------------------------
# OUTPUTS
# After deployment, AWS prints these values back to you (you'll need the API URL)
# ----------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Base URL of your deployed API - paste this into frontend/config.js
    Value: !Sub "https://${EventApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  EventsTableName:
    Value: !Ref EventsTable
  RegistrationsTableName:
    Value: !Ref RegistrationsTable
